<div class="min-h-[calc(100vh-58px-200px)] flex items-center justify-center px-6 py-12 bg-gray-50">
  <div class="w-full max-w-md">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <div class="text-center mb-8">
        <span class="text-5xl block mb-3">🛒</span>
        <h1 class="text-2xl font-bold text-gray-900">Entrar</h1>
        <p class="text-sm text-gray-500 mt-1">Acesse sua conta WebStore</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        @if (loginError) {
          <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">
            Login ou senha inválidos
          </div>
        }

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Login</label>
          <input
            type="text"
            name="login"
            [(ngModel)]="login"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
            [class.border-red-400]="loginFieldError"
            placeholder="Seu login ou e-mail"
          />
          @if (loginFieldError) {
            <p class="text-xs text-red-500 mt-1">{{ loginFieldError }}</p>
          }
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
            [class.border-red-400]="passwordError"
            placeholder="Sua senha"
          />
          @if (passwordError) {
            <p class="text-xs text-red-500 mt-1">{{ passwordError }}</p>
          }
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              name="remember"
              [(ngModel)]="remember"
              class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
            />
            <span class="text-sm text-gray-600">Lembrar-me</span>
          </label>
          <a routerLink="/auth/password-recovery" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
            Esqueci a senha
          </a>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors cursor-pointer">
          Entrar
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">
          Não tem conta?
          <a routerLink="/auth/registration" class="text-blue-600 hover:text-blue-800 font-medium ml-1">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
