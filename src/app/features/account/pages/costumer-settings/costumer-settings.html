<div class="min-h-screen bg-gray-50">
  <div class="max-w-4xl mx-auto px-6 py-8">
    <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
      <a routerLink="/" class="hover:text-blue-600">Home</a>
      <span>/</span>
      <a routerLink="/account" class="hover:text-blue-600">Minha Conta</a>
      <span>/</span>
      <span class="text-gray-900 font-medium">Configurações</span>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-8">Configurações da Conta</h1>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-100">
        <h2 class="font-bold text-gray-900">Informações Pessoais</h2>
      </div>
      <div class="px-6 py-5 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
            <input type="text" [value]="auth.user()?.name ?? ''" readonly class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-700" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email (login)</label>
            <input type="text" [value]="auth.user()?.email ?? ''" readonly class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-700" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Conta</label>
            <input type="text" [value]="auth.isAdmin() ? 'Administrador' : 'Cliente'" readonly class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-700" />
          </div>
        </div>
        <p class="text-xs text-gray-400">As informações da conta são gerenciadas no momento do cadastro.</p>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mt-6">
      <div class="px-6 py-5 border-b border-gray-100">
        <h2 class="font-bold text-gray-900">Ações</h2>
      </div>
      <div class="px-6 py-5 space-y-3">
        <a routerLink="/account/orders" class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
          <span class="text-xl">📋</span>
          <span class="text-sm font-medium text-gray-800">Ver Meus Pedidos</span>
        </a>
        <a routerLink="/account/addresses" class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
          <span class="text-xl">📍</span>
          <span class="text-sm font-medium text-gray-800">Gerenciar Endereços</span>
        </a>
        <a routerLink="/account/payments" class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
          <span class="text-xl">💳</span>
          <span class="text-sm font-medium text-gray-800">Gerenciar Cartões</span>
        </a>
        <button (click)="auth.logout()" class="w-full flex items-center gap-3 px-4 py-3 bg-red-50 rounded-lg hover:bg-red-100 transition-colors text-left cursor-pointer">
          <span class="text-xl">🚪</span>
          <span class="text-sm font-medium text-red-700">Sair da Conta</span>
        </button>
      </div>
    </div>
  </div>
</div>
