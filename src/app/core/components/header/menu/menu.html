<div class="relative">
  <button class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer" (click)="toggle()">
    <span>☰</span>
    <span>Categorias</span>
    <span class="text-xs text-gray-400 ml-0.5">▾</span>
  </button>

  @if (isOpen) {
    <div class="absolute top-full left-0 mt-2 w-56 bg-white border border-gray-200 rounded-xl shadow-xl z-50" (click)="$event.stopPropagation()">
      <div class="px-4 py-3 border-b border-gray-100">
        <p class="text-sm font-bold text-gray-800">Categorias</p>
      </div>
      <div class="py-1">
        <a routerLink="/products" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="close()">
          <span class="w-6 text-center text-base">📦</span>
          <span class="font-medium">Todos os Produtos</span>
        </a>
      </div>
      <div class="border-t border-gray-100 py-1">
        <a routerLink="/categories" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="close()">
          <span class="w-6 text-center text-base">📂</span>
          <span class="font-medium">Todas as Categorias</span>
        </a>
      </div>
      <div class="border-t border-gray-100 py-1">
        @for (cat of categories(); track cat.id) {
          <a routerLink="/category/{{ cat.id }}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="close()">
            <span class="w-6 text-center text-base">{{ cat.icon }}</span>
            <span class="flex-1">{{ cat.name }}</span>
            <span class="text-xs text-gray-400">({{ cat.count }})</span>
          </a>
        }
      </div>
    </div>
  }
</div>
